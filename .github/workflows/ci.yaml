name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build examples — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows
          - os: macos-latest
            preset: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Configure ────────────────────────────────────────────────────────
      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release --parallel

      # ── Verify every example binary exists ──────────────────────────────
      # Derived from the example directories themselves, so new examples
      # under examples/ are picked up automatically — nothing to update here.
      - name: Verify example binaries (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          for dir in examples/*/; do
            example=$(basename "$dir")
            [ -f "${dir}CMakeLists.txt" ] || continue
            bin="build/examples/${example}/${example}"
            if [ ! -f "$bin" ]; then
              echo "❌ Missing binary: $bin"
              exit 1
            fi
            echo "✅ $bin"
          done

      - name: Verify example binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Directory examples | ForEach-Object {
            $ex = $_.Name
            if (-Not (Test-Path (Join-Path $_.FullName "CMakeLists.txt"))) { return }
            $bin = "build\examples\$ex\Release\$ex.exe"
            if (-Not (Test-Path $bin)) {
              Write-Error "Missing binary: $bin"
              exit 1
            }
            Write-Host "✅ $bin"
          }
